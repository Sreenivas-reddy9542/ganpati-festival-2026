<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ganpati Festival Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:20px;background:#fff8ec;color:#4b2400}button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.danger{background:#d33;color:#fff}.ok{background:#2f7d32;color:#fff}.card{background:#fff;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 20px #0001}.card img{max-width:240px;max-height:220px;border-radius:12px;display:block;margin-bottom:10px}.row{display:flex;gap:10px;flex-wrap:wrap}input{padding:12px;border:1px solid #ccc;border-radius:10px;width:100%;max-width:420px}</style></head><body><h1>🙏 Ganpati Festival Photo Approval</h1><p id="status">Configure Supabase below, then sign in.</p><section class="card"><input id="url" placeholder="Supabase Project URL"><input id="key" placeholder="Supabase anon/public key" style="margin-top:10px"><input id="email" type="email" placeholder="Admin email" style="margin-top:10px"><input id="password" type="password" placeholder="Admin password" style="margin-top:10px"><div class="row" style="margin-top:10px"><button id="login" class="ok">Sign in</button><button id="logout">Sign out</button></div></section><section id="list"></section><script>let sb=null;const $=id=>document.getElementById(id);$('login').onclick=async()=>{try{sb=window.supabase.createClient($('url').value.trim(),$('key').value.trim());const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('status').textContent='Signed in. Loading pending photos…';await load();}catch(e){$('status').textContent=e.message}};$('logout').onclick=async()=>{if(sb)await sb.auth.signOut();$('status').textContent='Signed out.';$('list').innerHTML='';};async function load(){const {data,error}=await sb.from('festival_photos').select('*').eq('status','pending').order('created_at',{ascending:false});if(error){$('status').textContent=error.message;return}$('status').textContent=`${data.length} pending photo(s)`;$('list').innerHTML='';for(const p of data){const url=sb.storage.from('festival-photos').getPublicUrl(p.storage_path).data.publicUrl;const el=document.createElement('div');el.className='card';el.innerHTML=`<img src="${url}"><p><strong>${escapeHtml(p.caption||'No caption')}</strong></p><p>${escapeHtml(p.uploader_name||'Anonymous')}</p><div class="row"><button class="ok" onclick="review('${p.id}','approved')">Approve</button><button class="danger" onclick="review('${p.id}','rejected')">Reject</button></div>`;$('list').appendChild(el)}}async function review(id,status){const {error}=await sb.from('festival_photos').update({status}).eq('id',id);if(error)alert(error.message);else await load()}function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}</script></body></html>
